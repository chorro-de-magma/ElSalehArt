name: Build and Commit

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo Extended
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.131.0/hugo_extended_0.131.0_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - name: Build with Hugo
        run: hugo --gc --minify

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/
          git diff --cached --exit-code || (git commit -m "Rebuild site [skip ci]" && git push)
