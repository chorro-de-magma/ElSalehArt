<button onclick=nextImage()>❯</button></div></div></div><script>let currentIndex=0,images=[],isZoomed=!1,dragStartX=0,dragStartY=0,offsetX=0,offsetY=0,isDragging=!1,hasMoved=!1,clickThreshold=5;function initGallery(){const e=document.querySelectorAll(".pswp-gallery a");images=Array.from(e).map(e=>({src:e.href,title:e.dataset.title||e.querySelector("img").alt||"Untitled",caption:e.dataset.caption||""})),e.forEach((e,t)=>{e.addEventListener("click",e=>{e.preventDefault(),currentIndex=t,openModal()})});const t=document.getElementById("modalImg");t.addEventListener("mousedown",startDrag),t.addEventListener("click",handleImageClick),document.addEventListener("mousemove",dragImage),document.addEventListener("mouseup",stopDrag)}function openModal(){document.getElementById("modal").classList.add("active"),isZoomed=!1,offsetX=0,offsetY=0,updateImage()}function closeModal(){document.getElementById("modal").classList.remove("active"),isZoomed=!1,offsetX=0,offsetY=0}function closeOnBackdrop(e){e.target.id==="modal"&&closeModal()}function updateImage(){const e=document.getElementById("modalImg");e.src=images[currentIndex].src,e.style.transform="scale(1) translate(0, 0)",e.classList.remove("zoomed"),document.getElementById("modalTitle").textContent=images[currentIndex].title,document.getElementById("modalCaption").textContent=images[currentIndex].caption,isZoomed=!1,offsetX=0,offsetY=0}function handleImageClick(e){if(!hasMoved){e.stopPropagation();const t=e.target;isZoomed?(t.style.transform="scale(1) translate(0, 0)",t.classList.remove("zoomed"),isZoomed=!1,offsetX=0,offsetY=0):(t.style.transform="scale(2)",t.classList.add("zoomed"),isZoomed=!0)}hasMoved=!1}function startDrag(e){if(!isZoomed)return;dragStartX=e.clientX,dragStartY=e.clientY,hasMoved=!1,e.preventDefault()}function dragImage(e){if(!isZoomed||dragStartX===0)return;const t=e.clientX-dragStartX,n=e.clientY-dragStartY;if((Math.abs(t)>clickThreshold||Math.abs(n)>clickThreshold)&&(hasMoved=!0,isDragging=!0),isDragging){o
