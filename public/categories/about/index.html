<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Saleh Art</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.1/dist/photoswipe.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    header { text-align: center; margin: 40px 0; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    nav { margin: 30px 0; text-align: center; }
    nav a { color: #0099ff; text-decoration: none; margin: 0 15px; font-size: 1.1em; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 1200px; margin: 0 auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin: 40px 0; }
    .gallery-item { cursor: pointer; position: relative; overflow: hidden; border-radius: 8px; }
    .gallery-item img { width: 100%; height: 250px; object-fit: cover; transition: transform 0.3s; }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-item-info { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 10px; color: #fff; font-size: 0.9em; }
    .gallery-item-title { font-weight: bold; }
    .content { max-width: 800px; margin: 40px auto; line-height: 1.6; }
    .content h2 { margin: 20px 0 10px; font-size: 1.8em; }
    .content p { margin-bottom: 15px; }
    footer { text-align: center; margin-top: 60px; padding-top: 20px; border-top: 1px solid #333; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>El Saleh Art</h1>
    <p>Art Gallery</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/lithography/">Lithography</a>
    <a href="/paintings/">Paintings</a>
    <a href="/photographs/">Photographs</a>
    <a href="/sculptures/">Sculptures</a>
  </nav>

  <div class="container">
    
  <div class="content">
    <h2>About</h2>
    
    
  </div>

  <div class="gallery pswp-gallery">
    
  </div>

  </div>

  <footer>
    <p>&copy; 2026 El Saleh. All rights reserved.</p>
  </footer>

  <script type="module">
    import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.1/dist/photoswipe-lightbox.esm.min.js';
    const lightbox = new PhotoSwipeLightbox({
      gallery: '.pswp-gallery',
      children: 'a',
      pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.1/dist/photoswipe.esm.min.js')
    });
    lightbox.init();
  </script>
</body>
</html>
