<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Params.title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; display: flex; flex-direction: column; }
    header { text-align: center; margin: 40px 0; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    nav { margin: 30px 0; text-align: center; }
    nav a { color: #0099ff; text-decoration: none; margin: 0 15px; font-size: 1.1em; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 1400px; margin: 0 auto; flex: 1; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 40px 0; auto-rows: 280px; }
    .gallery a { display: block; cursor: pointer; border-radius: 8px; overflow: hidden; background: #333; }
    .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .gallery a:hover img { transform: scale(1.05); }
    .content { max-width: 800px; margin: 40px auto; line-height: 1.6; }
    .content h2 { margin: 20px 0 10px; font-size: 1.8em; }
    .content p { margin-bottom: 15px; }
    footer { text-align: center; margin-top: auto; padding-top: 20px; border-top: 1px solid #333; color: #666; }
    
    /* Modal styles */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { position: relative; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; }
    .modal-img-container { display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; overflow: hidden; }
    .modal-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; transition: transform 0.2s; user-select: none; }
    .modal-img.zoomed { cursor: grab; }
    .modal-img.zoomed:active { cursor: grabbing; }
    .modal-info { background: rgba(255,255,255,0.05); padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .modal-title { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
    .modal-caption { font-size: 0.9em; color: rgba(255,255,255,0.7); }
    .modal-close { position: absolute; top: -40px; right: 0; color: #fff; font-size: 36px; cursor: pointer; user-select: none; }
    .modal-nav { position: absolute; width: calc(100% + 100px); height: 100%; display: flex; justify-content: space-between; align-items: center; left: -50px; top: 0; pointer-events: none; }
    .modal-nav button { background: transparent; border: none; color: rgba(255,255,255,0.5); font-size: 48px; cursor: pointer; padding: 20px; user-select: none; pointer-events: auto; }
    .modal-nav button:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Params.title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/lithography/">Lithography</a>
    <a href="/paintings/">Paintings</a>
    <a href="/photographs/">Photographs</a>
    <a href="/sculptures/">Sculptures</a>
  </nav>

  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>

  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </footer>

  <div class="modal" id="modal" onclick="closeOnBackdrop(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-close" onclick="closeModal()">×</div>
      <div class="modal-img-container" id="modalImgContainer">
        <img class="modal-img" id="modalImg">
      </div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-caption" id="modalCaption"></div>
      </div>
      <div class="modal-nav">
        <button onclick="prevImage()">❮</button>
        <button onclick="nextImage()">❯</button>
      </div>
    </div>
  </div>

  <script>
    let currentIndex = 0;
    let images = [];
    let isZoomed = false;
    let dragStartX = 0, dragStartY = 0;
    let offsetX = 0, offsetY = 0;
    let isDragging = false;
    let clickThreshold = 5; // pixels

    function initGallery() {
      const galleryLinks = document.querySelectorAll('.pswp-gallery a');
      images = Array.from(galleryLinks).map(link => ({
        src: link.href,
        title: link.dataset.title || link.querySelector('img').alt || 'Untitled',
        caption: link.dataset.caption || ''
      }));
      
      galleryLinks.forEach((link, idx) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          currentIndex = idx;
          openModal();
        });
      });

      const img = document.getElementById('modalImg');
      img.addEventListener('mousedown', startDrag);
      img.addEventListener('click', handleImageClick);
      document.addEventListener('mousemove', dragImage);
      document.addEventListener('mouseup', stopDrag);
    }

    function openModal() {
      document.getElementById('modal').classList.add('active');
      isZoomed = false;
      offsetX = 0;
      offsetY = 0;
      updateImage();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      isZoomed = false;
      offsetX = 0;
      offsetY = 0;
    }

    function closeOnBackdrop(e) {
      if (e.target.id === 'modal') closeModal();
    }

    function updateImage() {
      const img = document.getElementById('modalImg');
      img.src = images[currentIndex].src;
      img.style.transform = 'scale(1) translate(0, 0)';
      img.classList.remove('zoomed');
      document.getElementById('modalTitle').textContent = images[currentIndex].title;
      document.getElementById('modalCaption').textContent = images[currentIndex].caption;
      isZoomed = false;
      offsetX = 0;
      offsetY = 0;
    }

    function handleImageClick(e) {
      // Only toggle zoom on pure click (user didn't drag)
      if (!isDragging) {
        e.stopPropagation();
        const img = e.target;
        if (isZoomed) {
          img.style.transform = 'scale(1) translate(0, 0)';
          img.classList.remove('zoomed');
          isZoomed = false;
          offsetX = 0;
          offsetY = 0;
        } else {
          img.style.transform = 'scale(2)';
          img.classList.add('zoomed');
          isZoomed = true;
        }
      }
      // Always reset after click
      isDragging = false;
      dragStartX = 0;
      dragStartY = 0;
    }

    function startDrag(e) {
      if (!isZoomed) return;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      isDragging = false;
      e.preventDefault();
    }

    function dragImage(e) {
      if (!isZoomed || dragStartX === 0) return;
      const deltaX = e.clientX - dragStartX;
      const deltaY = e.clientY - dragStartY;
      
      // Only start dragging if movement exceeds threshold
      if (Math.abs(deltaX) > clickThreshold || Math.abs(deltaY) > clickThreshold) {
        isDragging = true;
      }
      
      if (isDragging) {
        offsetX += deltaX;
        offsetY += deltaY;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        
        const img = document.getElementById('modalImg');
        img.style.transform = `scale(2) translate(${offsetX}px, ${offsetY}px)`;
      }
    }

    function stopDrag() {
      dragStartX = 0;
      dragStartY = 0;
      isDragging = false;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      updateImage();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateImage();
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('modal').classList.contains('active')) {
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'Escape') closeModal();
      }
    });

    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>
</html>
