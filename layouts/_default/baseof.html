<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Params.title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    header { text-align: center; margin: 40px 0; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    nav { margin: 30px 0; text-align: center; }
    nav a { color: #0099ff; text-decoration: none; margin: 0 15px; font-size: 1.1em; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 1400px; margin: 0 auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin: 40px 0; }
    .gallery a { display: block; cursor: pointer; border-radius: 8px; overflow: hidden; }
    .gallery img { width: 100%; height: auto; display: block; }
    .content { max-width: 800px; margin: 40px auto; line-height: 1.6; }
    .content h2 { margin: 20px 0 10px; font-size: 1.8em; }
    .content p { margin-bottom: 15px; }
    footer { text-align: center; margin-top: 60px; padding-top: 20px; border-top: 1px solid #333; color: #666; }
    
    /* Modal styles */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-img { max-width: 90vw; max-height: 90vh; object-fit: contain; cursor: zoom-in; transition: transform 0.2s; }
    .modal-img.zoomed { cursor: zoom-out; }
    .modal-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; }
    .modal-nav { position: absolute; width: 100%; display: flex; justify-content: space-between; top: 50%; transform: translateY(-50%); }
    .modal-nav button { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 30px; padding: 20px; cursor: pointer; }
    .modal-nav button:hover { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Params.title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/lithography/">Lithography</a>
    <a href="/paintings/">Paintings</a>
    <a href="/photographs/">Photographs</a>
    <a href="/sculptures/">Sculptures</a>
  </nav>

  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>

  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </footer>

  <div class="modal" id="modal">
    <div class="modal-close" onclick="closeModal()">×</div>
    <img class="modal-img" id="modalImg" onclick="toggleZoom(event)">
    <div class="modal-nav">
      <button onclick="prevImage()">❮</button>
      <button onclick="nextImage()">❯</button>
    </div>
  </div>

  <script>
    let currentIndex = 0;
    let images = [];
    let isZoomed = false;

    function initGallery() {
      const galleryLinks = document.querySelectorAll('.pswp-gallery a');
      images = Array.from(galleryLinks).map(link => link.href);
      
      galleryLinks.forEach((link, idx) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          currentIndex = idx;
          openModal();
        });
      });
    }

    function openModal() {
      document.getElementById('modal').classList.add('active');
      updateImage();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      isZoomed = false;
    }

    function updateImage() {
      const img = document.getElementById('modalImg');
      img.src = images[currentIndex];
      img.classList.remove('zoomed');
      isZoomed = false;
    }

    function toggleZoom(e) {
      const img = e.target;
      if (isZoomed) {
        img.style.transform = 'scale(1)';
        img.classList.remove('zoomed');
        isZoomed = false;
      } else {
        img.style.transform = 'scale(1.5)';
        img.classList.add('zoomed');
        isZoomed = true;
      }
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      updateImage();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateImage();
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('modal').classList.contains('active')) {
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'Escape') closeModal();
      }
    });

    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>
</html>
