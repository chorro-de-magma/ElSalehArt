<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Params.title }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    header { text-align: center; margin: 40px 0; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    nav { margin: 30px 0; text-align: center; }
    nav a { color: #0099ff; text-decoration: none; margin: 0 15px; font-size: 1.1em; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 1200px; margin: 0 auto; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(auto, 1fr)); gap: 20px; margin: 40px 0; }
    .gallery-item { position: relative; display: inline-block; }
    .gallery-item img { max-width: 100%; height: auto; display: block; border-radius: 8px; }
    .gallery-item-info { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 10px; color: #fff; font-size: 0.9em; opacity: 0; transition: opacity 0.3s; }
    .gallery-item:hover .gallery-item-info { opacity: 1; }
    .gallery-item-title { font-weight: bold; }
    .content { max-width: 800px; margin: 40px auto; line-height: 1.6; }
    .content h2 { margin: 20px 0 10px; font-size: 1.8em; }
    .content p { margin-bottom: 15px; }
    footer { text-align: center; margin-top: 60px; padding-top: 20px; border-top: 1px solid #333; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Params.title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/lithography/">Lithography</a>
    <a href="/paintings/">Paintings</a>
    <a href="/photographs/">Photographs</a>
    <a href="/sculptures/">Sculptures</a>
  </nav>

  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>

  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
</body>
</html>
