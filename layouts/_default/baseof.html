<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <style>
    body { font-family: sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; }
    nav { margin: 20px 0; text-align: center; }
    nav a { margin: 0 10px; text-decoration: none; color: #0066cc; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin: 40px 0; }
    .gallery img { width: 100%; height: auto; border-radius: 8px; }
    .card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
    .card h2 { margin: 10px 0; }
  </style>
</head>
<body>
  <h1>{{ .Site.Params.title }}</h1>
  <nav>
    <a href="/">Home</a>
    <a href="/lithography/">Lithography</a>
    <a href="/paintings/">Paintings</a>
    <a href="/photographs/">Photographs</a>
    <a href="/sculptures/">Sculptures</a>
  </nav>
  
  {{ block "main" . }}{{ end }}
</body>
</html>
