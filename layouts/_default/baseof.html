<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Params.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.1/dist/photoswipe.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    header { text-align: center; margin: 40px 0; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    nav { margin: 30px 0; text-align: center; }
    nav a { color: #0099ff; text-decoration: none; margin: 0 15px; font-size: 1.1em; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 100%; margin: 0 auto; padding: 0 20px; }
    .gallery { display: flex; flex-wrap: wrap; gap: 20px; margin: 40px auto; justify-content: center; }
    .gallery a { display: inline-block; cursor: pointer; border-radius: 8px; overflow: hidden; transition: transform 0.3s; }
    .gallery a:hover { transform: scale(1.02); }
    .gallery img { display: block; max-width: 500px; height: auto; }
    .content { max-width: 800px; margin: 40px auto; line-height: 1.6; }
    .content h2 { margin: 20px 0 10px; font-size: 1.8em; }
    .content p { margin-bottom: 15px; }
    footer { text-align: center; margin-top: 60px; padding-top: 20px; border-top: 1px solid #333; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Params.title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </header>

  <nav>
    <a href="/">Home</a>
    <a href="/lithography/">Lithography</a>
    <a href="/paintings/">Paintings</a>
    <a href="/photographs/">Photographs</a>
    <a href="/sculptures/">Sculptures</a>
  </nav>

  <div class="container">
    {{ block "main" . }}{{ end }}
  </div>

  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </footer>

  <script type="module">
    import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.1/dist/photoswipe-lightbox.esm.min.js';
    const lightbox = new PhotoSwipeLightbox({
      gallery: '.pswp-gallery',
      children: 'a',
      pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.1/dist/photoswipe.esm.min.js')
    });
    lightbox.init();
  </script>
</body>
</html>
